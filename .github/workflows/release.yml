name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g. 0.3.0)"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # ── CI guardrails ──────────────────────────────────────────────────────
      - name: Lint
        run: npm run lint

      - name: Format check
        run: npx prettier --check .

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      # ── Version guardrails ─────────────────────────────────────────────────
      - name: Verify tag does not already exist
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/v${{ inputs.version }}$"; then
            echo "::error::Tag v${{ inputs.version }} already exists — nothing to release."
            exit 1
          fi

      - name: Verify version is strictly greater than current
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          node -e "
            const parse = v => v.split('.').map(Number);
            const [maj, min, pat] = parse('${{ inputs.version }}');
            const [cmaj, cmin, cpat] = parse('$CURRENT');
            const greater =
              maj > cmaj ||
              (maj === cmaj && min > cmin) ||
              (maj === cmaj && min === cmin && pat > cpat);
            if (!greater) {
              console.error('v${{ inputs.version }} is not greater than current v$CURRENT');
              process.exit(1);
            }
          "

      # ── Bump, tag, release ─────────────────────────────────────────────────
      - name: Bump version in package.json
        run: |
          npm version ${{ inputs.version }} --no-git-tag-version
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: bump version to ${{ inputs.version }}"
          git push origin main

      - name: Create tag and publish release
        run: |
          git tag v${{ inputs.version }}
          git push origin v${{ inputs.version }}
          gh release create v${{ inputs.version }} \
            --title "v${{ inputs.version }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
