name: CI

on:
  pull_request:

jobs:
  pin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check actions are pinned to commit SHAs
        run: |
          unpinned=$(grep -rE '^\s+uses:\s+' .github/workflows/ \
            | grep -vE 'uses:\s+\./' \
            | grep -vE '@[0-9a-f]{40}')
          if [ -n "$unpinned" ]; then
            echo "::error::Actions not pinned to a commit SHA:"
            echo "$unpinned"
            exit 1
          fi
          echo "All actions are pinned to commit SHAs."

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npx prettier --check .

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test
