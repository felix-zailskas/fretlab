name: CI

on:
  pull_request:

jobs:
  pin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check actions are pinned to commit SHAs
        run: |
          unpinned=$(grep -rE '^\s+uses:\s+' .github/workflows/ \
            | grep -vE 'uses:\s+\./' \
            | grep -vE '@[0-9a-f]{40}')
          if [ -n "$unpinned" ]; then
            echo "::error::Actions not pinned to a commit SHA:"
            echo "$unpinned"
            exit 1
          fi
          echo "All actions are pinned to commit SHAs."

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npx prettier --check .

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test
